<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #170d12;
    --frame: #241119;
    --frame-edge: #3a1c26;
    --gold: #cf9d55;
    --ivory: #f3e9dc;
    --dusty: #a9838d;
  }

  * { box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    background: var(--bg);
    font-family:'Jost', sans-serif;
    color: var(--ivory);
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100svh;
    padding: 16px;
    overflow:hidden;
  }

  .screen{
    position:relative;
    width:100%;
    max-width: 760px;
    aspect-ratio: 16/9;
    max-height: 100svh;
    background: var(--frame);
    border-radius: 6px;
    box-shadow: 0 0 0 1px var(--frame-edge), 0 40px 80px -30px rgba(0,0,0,.9);
    overflow:hidden;
  }

  @media (max-width: 600px){
    body{ padding:0; }
    .screen{
      aspect-ratio: auto;
      width: 100%;
      height: 100svh;
      max-height: 100svh;
      border-radius: 0;
    }
    .rail{ display:none; }
  }

  @media (max-height: 500px) and (min-width: 601px){
    .screen{ aspect-ratio: 4/3; }
  }

  /* ---- sprocket rail, cinematic touch ---- */
  .rail{
    position:absolute;
    top:0; bottom:0;
    width: 14px;
    display:flex;
    flex-direction:column;
    justify-content:space-evenly;
    align-items:center;
    z-index:5;
    opacity:.5;
  }
  .rail span{
    width:5px; height:5px;
    border-radius:1px;
    background: var(--gold);
    opacity:.35;
  }
  .rail.left{ left:6px; }
  .rail.right{ right:6px; }

  /* ---- poster (illustration) ---- */
  .poster{
    position:absolute;
    inset:0;
    transition: opacity 900ms ease, transform 900ms ease;
  }
  .poster svg{ width:100%; height:100%; display:block; }

  .poster.hidden{
    opacity:0;
    transform: scale(1.03);
    pointer-events:none;
  }

  .caption{
    position:absolute;
    left:32px; bottom:22px;
    z-index:4;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size: 15px;
    color: var(--dusty);
    letter-spacing:.02em;
    transition: opacity 500ms ease;
  }
  .caption.hidden{ opacity:0; }

  .time{
    position:absolute;
    right:30px; bottom:22px;
    z-index:4;
    font-size: 12px;
    color: var(--dusty);
    letter-spacing:.08em;
    transition: opacity 500ms ease;
  }
  .time.hidden{ opacity:0; }

  /* ---- play button ---- */
  .play-btn{
    position:absolute;
    top:50%; left:50%;
    transform: translate(-50%,-50%);
    width: 74px; height:74px;
    border-radius:50%;
    background: rgba(23,13,18,.35);
    border: 1.5px solid var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:6;
    transition: transform 300ms ease, opacity 500ms ease, background 300ms ease;
  }
  .play-btn:hover{
    transform: translate(-50%,-50%) scale(1.06);
    background: rgba(23,13,18,.55);
  }
  .play-btn.hidden{
    opacity:0;
    pointer-events:none;
    transform: translate(-50%,-50%) scale(.85);
  }
  .play-btn svg{ width:22px; height:22px; margin-left:4px; }

  /* ---- message layer ---- */
  .message-layer{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 44px 54px;
    z-index:3;
    background: radial-gradient(ellipse at center, #1d1116 0%, #150c10 100%);
    overflow-y:auto;
  }

  .message{
    font-family:'Cormorant Garamond', serif;
    font-weight:400;
    font-size: clamp(17px, 2.6vw, 25px);
    line-height:1.65;
    max-width: 60ch;
    color: var(--ivory);
    text-align:center;
  }

  @media (max-width: 600px){
    .message-layer{ padding: 28px 22px; }
    .message{ font-size: 18px; line-height:1.6; }
    .play-btn{ width:64px; height:64px; }
    .caption{ left:20px; bottom:16px; font-size:13px; }
    .time{ right:20px; bottom:16px; font-size:11px; }
  }

  .cursor{
    display:inline-block;
    width: 2px;
    height: 1em;
    background: var(--gold);
    margin-left: 3px;
    vertical-align: -0.15em;
    animation: blink 900ms steps(1) infinite;
  }
  .cursor.done{ animation: none; opacity:0; }

  @keyframes blink{
    0%, 49%{ opacity:1; }
    50%, 100%{ opacity:0; }
  }

  .progress{
    position:absolute;
    left:0; right:0; bottom:0;
    height:2px;
    background: rgba(207,157,85,.15);
    z-index:7;
  }
  .progress-bar{
    height:100%;
    width:0%;
    background: var(--gold);
    transition: width 60ms linear;
  }
</style>
</head>
<body>

<div class="screen" id="screen">
  <div class="rail left">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="rail right">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- poster illustration -->
  <div class="poster" id="poster">
    <svg viewBox="0 0 760 428" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2a1420"/>
          <stop offset="55%" stop-color="#1d0f18"/>
          <stop offset="100%" stop-color="#140a10"/>
        </linearGradient>
        <radialGradient id="moon" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f4e6c8"/>
          <stop offset="100%" stop-color="#cf9d55"/>
        </radialGradient>
      </defs>
      <rect width="760" height="428" fill="url(#sky)"/>

      <!-- stars -->
      <g fill="#f3e9dc" opacity="0.55">
        <circle cx="60" cy="60" r="1.4"/>
        <circle cx="120" cy="110" r="1"/>
        <circle cx="200" cy="50" r="1.6"/>
        <circle cx="300" cy="90" r="1"/>
        <circle cx="380" cy="40" r="1.3"/>
        <circle cx="460" cy="80" r="1"/>
        <circle cx="540" cy="55" r="1.5"/>
        <circle cx="610" cy="100" r="1"/>
        <circle cx="680" cy="65" r="1.3"/>
        <circle cx="90" cy="160" r="1"/>
        <circle cx="250" cy="140" r="1.2"/>
        <circle cx="420" cy="150" r="1"/>
        <circle cx="600" cy="150" r="1.2"/>
        <circle cx="700" cy="140" r="1"/>
      </g>

      <!-- moon -->
      <circle cx="600" cy="90" r="34" fill="url(#moon)" opacity="0.9"/>

      <!-- distant hills -->
      <path d="M0,300 Q190,255 380,290 T760,270 L760,428 L0,428 Z" fill="#241119" opacity="0.9"/>
      <path d="M0,340 Q190,300 380,330 T760,315 L760,428 L0,428 Z" fill="#170d12"/>

      <!-- two silhouettes, close together -->
      <g transform="translate(330,345)" fill="#0f070a">
        <path d="M0,55 C-2,30 2,10 10,0 C16,7 20,20 18,40 C17,48 15,55 15,55 Z"/>
        <circle cx="9" cy="-4" r="7"/>
        <path d="M28,58 C24,32 29,9 39,-2 C46,6 50,22 47,42 C46,50 44,58 44,58 Z"/>
        <circle cx="38" cy="-6" r="7.5"/>
      </g>
    </svg>
  </div>

  <div class="caption" id="caption">para ti — dale play</div>
  <div class="time" id="time">00:00</div>

  <div class="play-btn" id="playBtn" role="button" aria-label="Reproducir">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M6 3.5L20 12L6 20.5V3.5Z" fill="#f3e9dc"/>
    </svg>
  </div>

  <!-- message layer, revealed after play -->
  <div class="message-layer" id="messageLayer" style="display:none; opacity:0;">
    <p class="message" id="messageText"><span class="cursor"></span></p>
  </div>

  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
</div>

<script>
  // --------------------------------------------------
  // EDITA TU MENSAJE AQUÍ — reemplaza el texto entre comillas.
  // --------------------------------------------------
  const MESSAGE = "Amor, quiero que sepas que para mí eres muy importante. Me caso contigo, no importa si es en México o en Chile; quiero estar contigo, quiero cantarte en persona, besarte, abrazarte, recorrer cada centímetro de tu piel. Quiero amarte como es debido y casarme como es debido. Eres lo más importante que tengo en esta vida y también lo más bonito que tengo. Quiero estar contigo siempre, sin importar qué pase. Hay tantas cosas que quiero hacer contigo, tanto que quiero decirte y tanto que quiero expresar. Me has vuelto una persona muy feliz, me provocas una sonrisa siempre y el simple hecho de pasar tiempo contigo me hace muy, muy, muy feliz. MI AMOR, TE AMO, te quiero dedicar mi vida entera.";

  const screen = document.getElementById('screen');
  const poster = document.getElementById('poster');
  const caption = document.getElementById('caption');
  const time = document.getElementById('time');
  const playBtn = document.getElementById('playBtn');
  const messageLayer = document.getElementById('messageLayer');
  const messageText = document.getElementById('messageText');
  const progressBar = document.getElementById('progressBar');

  let started = false;

  playBtn.addEventListener('click', () => {
    if (started) return;
    started = true;

    poster.classList.add('hidden');
    caption.classList.add('hidden');
    time.classList.add('hidden');
    playBtn.classList.add('hidden');

    messageLayer.style.display = 'flex';
    requestAnimationFrame(() => { messageLayer.style.opacity = '1'; });

    setTimeout(typeMessage, 700);
  });

  function typeMessage(){
    let i = 0;
    const total = MESSAGE.length;
    const speed = 38; // ms por caracter

    const interval = setInterval(() => {
      i++;
      const shown = MESSAGE.slice(0, i);
      messageText.innerHTML = escapeHtml(shown) + '<span class="cursor"></span>';
      progressBar.style.width = Math.min(100, (i/total)*100) + '%';

      if (i >= total){
        clearInterval(interval);
        const cursor = messageText.querySelector('.cursor');
        if (cursor) cursor.classList.add('done');
      }
    }, speed);
  }

  function escapeHtml(str){
    return str
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;');
  }
</script>

</body>
</html>
